server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, re-resolved every 10s. Without this, nginx
    # resolves the upstream hostname ONCE at startup and caches the
    # container IP forever — rebuilding docs-wiki without restarting web
    # then 502s every /api request (field incident 2026-08-11). The
    # variable indirection below is what forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Administration is a separate application, including its API and old deep links.
    location ~ ^/api/(?:[^/]+/)?admin(?:/|$) { return 404; }
    location ~ ^/[^/]+/admin(?:/|$) { return 404; }

    location /api/ {
        set $docs_wiki_upstream http://docs-wiki:8765;
        proxy_pass $docs_wiki_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: stream tokens as they arrive, allow long-running answers
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
