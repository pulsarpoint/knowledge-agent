# litellm proxy config — one OpenAI-compatible endpoint
# (http://litellm:4400/v1 inside compose) fronting AWS Bedrock for both
# chat (agents) and embeddings (memory search), so no service needs its
# own AWS SDK/credentials wiring.
#
# model_name is the public alias a model connection in LLM Settings
# calls by; `model:` is the real litellm/Bedrock model id it maps to.
#
# `os.environ/<VAR>` is litellm's own interpolation syntax (confirmed
# supported for any config.yaml value, litellm docs "Load API Keys /
# config values from Environment", 2026-08-05) — NOT shell-style
# `${VAR}`, which litellm does not expand. AWS_REGION_NAME is set by
# docker-compose.yml from the root .env's AWS_REGION.
#
# No aws_access_key_id/aws_secret_access_key here: authentication is
# the AWS_BEARER_TOKEN_BEDROCK bearer-token env var (litellm docs
# "AWS Bedrock > Authentication" — read directly from the process
# environment by litellm's boto3 layer, no config.yaml key needed),
# set on the litellm service in docker-compose.yml from the root .env.
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: bedrock/eu.anthropic.claude-sonnet-5
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: bedrock-embed
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: os.environ/AWS_REGION_NAME
