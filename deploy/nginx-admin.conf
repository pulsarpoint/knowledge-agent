server {
    client_max_body_size 12m;
    listen 80;
    # Browsers send every localhost cookie to every port; both oauth2-proxy sessions
    # plus Keycloak/Phoenix cookies exceed the default 8 KB header buffer (400).
    large_client_header_buffers 4 32k;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $admin_upstream http://admin-api:8766;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
