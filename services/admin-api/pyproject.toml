[project]
name = "knowledge-admin"
version = "0.1.0"
description = "Knowledge Agent v3 administration API"
requires-python = ">=3.12"
dependencies = [
    "knowledge-llm",
    "openai-agents==0.19.2",
    "python-dotenv>=1.0",
    "arize-phoenix-otel>=0.17.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "cryptography>=44",
    "jira2markdown>=0.5.1",
    "asyncssh>=2.21,<3",
    "mcp>=1.26,<2",
    "litellm==1.100.0",
    "openinference-instrumentation-openai-agents==2.4.1",
    "croniter>=6.2.4",
    "tzdata>=2026.3",
    "jinja2>=3.1.6",
    "regex>=2026.9.3",
    "networkx==3.5",
]

[project.scripts]
knowledge-admin = "knowledge_admin.cli:main"
knowledge-repo-worker = "knowledge_admin.code_projects.worker:main"
knowledge-agent-session-worker = "knowledge_admin.knowledge_agents.native_sessions:main"

[tool.uv.sources]
knowledge-llm = { path = "../../packages/llm-settings", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_admin"]
