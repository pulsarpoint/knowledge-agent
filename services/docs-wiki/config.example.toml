# docs-wiki configuration (copy to config.toml and edit).
#
# Indexing and the docs folders themselves belong to the sibling `rag`
# service now (see services/rag/config.example.toml) — this file only
# configures docs-wiki's own app list, its LLM (chat), and where to
# reach `rag`.
#
# Run with:  uv run docs-wiki serve config.toml
# A bare docs folder also works for a single app with no config file
# (but still requires DOCS_WIKI_RAG_URL to be set — see below):
#            uv run docs-wiki serve /work/my-app-docs

# One [[apps]] entry per application. `name` appears in the UI and URLs
# (one app configured = no switcher, the UI opens directly on it), and
# must match the `name` of the corresponding [[collections]] entry in
# the rag service's config — that's how docs-wiki asks rag for this
# app's documents.
[[apps]]
name = "my-app"

# Optional: the application root (the code that was documented — one git
# repository, or a folder of service repositories). Enables the
# commits-behind freshness badges. Omit to show freshness as "unknown".
app_root = "/work/my-app"

# A second application — remove or duplicate as needed.
[[apps]]
name = "billing-suite"

# Required: where the rag service is reachable. `serve` exits with an
# error if neither this nor DOCS_WIKI_RAG_URL is set — reading, search,
# and Ask all depend on it.
[rag]
url = "http://localhost:8790"

# Optional: LLM settings — enables Ask (chat only; embeddings are the
# rag service's concern, configured there). Read/search need none of
# this. Environment variables override; API keys go in .env, never here
# (see .env.example).
[llm]
base_url = "http://localhost:11434/v1"
chat_model = "qwen2.5:14b"
# reasoning_effort = "none"   # optional; overrides per-model profiles

# Optional: enables "Ask the code" — escalating a NOT_COVERED chat turn to
# a separate, read-only code-question service (services/code-agent). Omit
# entirely to leave escalation off; nothing else changes.
# [code_agent]
# url = "http://localhost:8795"

# Optional: service settings.
# [server]
# cors_origin = "http://localhost:5173"   # allow the React dev server
# session_retention_days = 90             # 0 disables conversation pruning
# ui_dist = "/work/docs-wiki-ui/build/client"  # optional; auto-detected
# state_dir = "/work/docs-wiki-state"     # gaps.jsonl + sessions.db; default ~/.local/state/docs-wiki
