[project]
name = "docs-wiki"
version = "0.1.0"
description = "Local reading, search, and grounded Q&A over app-docs documentation"
requires-python = ">=3.12"
dependencies = [
    "knowledge-llm",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai-agents==0.19.2",
    "arize-phoenix-otel>=0.17.1",
    "markdown-it-py>=3,<5",
]

[project.scripts]
docs-wiki = "docs_wiki.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_wiki"]

[tool.uv.sources]
knowledge-llm = { path = "../../packages/llm-settings", editable = true }
