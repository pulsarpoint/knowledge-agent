[project]
name = "rag"
version = "0.1.0"
description = "Standalone RAG service: filesystem indexing + blackbox retrieval API"
requires-python = ">=3.12"
dependencies = [
    "knowledge-llm",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "markdown-it-py[linkify]>=3.0",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0",
    "fastmcp==3.4.5",
    "psycopg[binary]>=3.2",
    "cryptography>=44",
]

[tool.uv.sources]
knowledge-llm = { path = "../../packages/llm-settings", editable = true }

[project.scripts]
rag = "rag.cli:main"
rag-workspace-worker = "rag.workspace_worker:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
