[project]
name = "code-agent"
version = "0.1.0"
description = "Repository inventory and source browsing API"
requires-python = ">=3.12"
dependencies = [
    "knowledge-llm",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.uv.sources]
knowledge-llm = { path = "../../packages/llm-settings", editable = true }
